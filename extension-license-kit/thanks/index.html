<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Message received | Good Burrow</title>
    <style>
      :root{color-scheme:light;--paper:#f4ecdf;--cream:#fffaf2;--ink:#292923;--forest:#294239;--clay:#b7664f;--muted:#5d6057}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 88% 5%,rgba(217,168,79,.17),transparent 26rem),var(--paper);color:var(--ink);font:16px/1.62 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(620px,100%);padding:clamp(34px,7vw,64px);border:1px solid rgba(41,41,35,.14);border-radius:28px;background:var(--cream);box-shadow:0 24px 70px rgba(58,45,31,.13)}.mark{width:38px;height:38px;border-radius:50% 50% 44% 44%;background:var(--forest);box-shadow:inset 0 -11px 0 var(--clay)}p{color:var(--muted)}h1{margin:28px 0 14px;font-size:clamp(2.6rem,8vw,4.4rem);line-height:.95;letter-spacing:-.06em}a{display:inline-flex;margin-top:16px;padding:12px 18px;border-radius:999px;background:var(--forest);color:var(--cream);font-weight:750;text-decoration:none}
    </style>
  </head>
  <body><main class="card"><div class="mark" aria-hidden="true"></div><h1>Message received.</h1><p>Thanks for reaching out about the Extension License Kit. We will reply by email.</p><a href="/extension-license-kit/">Return to the License Kit</a></main></body>
</html>
