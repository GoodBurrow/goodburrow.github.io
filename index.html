<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Good Burrow</title>
  <meta name="description" content="Small, thoughtful software for people who prefer quiet control.">
  <style>
    :root { color-scheme: light; font-family: ui-rounded, "Avenir Next", system-ui, sans-serif; background: #f5efe4; color: #202623; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(680px, calc(100% - 48px)); padding: 72px 0; }
    p:first-child { color: #8c6d38; font-size: .78rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: .25rem 0 1rem; font-size: clamp(3rem, 10vw, 6.5rem); letter-spacing: -.07em; line-height: .9; }
    .lead { max-width: 560px; color: #5c625e; font-size: clamp(1.15rem, 3vw, 1.45rem); line-height: 1.55; }
    article { margin-top: 48px; padding: 28px; border: 1px solid #d8cbb8; border-radius: 24px; background: rgba(255,255,255,.48); }
    article h2 { margin: 0 0 8px; font-size: 1.5rem; }
    article p { color: #666b67; line-height: 1.55; }
    a { display: inline-block; margin-top: 8px; color: #f8f4ec; background: #202623; padding: 12px 18px; border-radius: 999px; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <p>Thoughtful software</p>
    <h1>Good Burrow</h1>
    <p class="lead">Small, dependable tools that respect your privacy, your time, and your ability to take your data with you.</p>
    <article>
      <h2>Burrowmarks</h2>
      <p>A private, encrypted place for Firefox bookmarks you would rather keep to yourself.</p>
      <a href="Burrowmarks/">Explore Burrowmarks</a>
    </article>
  </main>
</body>
</html>
